name: Phase 3B Characters, Weapons and Monster Cache
on:
  push:
    branches: ['test/phase3b-characters-weapons']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase3b-preview-${{ github.ref }}
  cancel-in-progress: true
env:
  GODOT_VERSION: "4.3"
  GODOT_BIN: ".cache/godot/Godot_v4.3-stable_linux.x86_64"
  LIBGL_ALWAYS_SOFTWARE: "1"
  CI_CAPTURE: "1"
jobs:
  prepare-assets:
    name: Download CC0 assets, Assimp-convert and cache
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Cache Phase 3B source archives and pinned CC0 downloads
        id: phase3b-assets
        uses: actions/cache@v4
        with:
          path: .cache/phase3b/source
          key: phase3b-source-v1-${{ hashFiles('ci/prepare_phase3b_assets.py') }}-phase3b-v2
      - name: Install Assimp, 7z and preparation tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends assimp-utils blender python3-numpy p7zip-full curl unzip python3-pip npm
          mkdir -p .cache/godot .cache/tools .cache/phase3b assets/phase3b artifacts
          assimp version
          blender --background --factory-startup --python-expr "import sys; sys.path.append('/usr/lib/python3/dist-packages'); import numpy; print('BLENDER_NUMPY_OK:', numpy.__version__)"
      - name: Install Godot 4.3 and gltfpack
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o .cache/godot/godot.zip
          unzip -o .cache/godot/godot.zip -d .cache/godot
          chmod +x "$GODOT_BIN"
          npm install --global --prefix "$GITHUB_WORKSPACE/.cache/tools" gltfpack
          echo "$GITHUB_WORKSPACE/.cache/tools/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/.cache/tools/bin:$PATH"
          command -v gltfpack
          gltfpack -h >/dev/null 2>&1 || true
          "$GODOT_BIN" --version
      - name: Set up Node for Ara 3D Gen
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pinned Ara 3D Gen CLI and print its actual preset catalogue
        run: |
          set -euo pipefail
          npm install --global "ara3d@0.9.0"
          command -v ara3d
          ara3d presets | tee artifacts/ara3d_presets.log
      - name: Generate five high-detail CC0 humanoids and audit topology
        run: |
          set -euo pipefail
          python3 ci/generate_phase3b_characters.py 2>&1 | tee artifacts/phase3b_character_generation.log
          test -s assets/phase3b/characters/ara3d_archer.glb
          test -s assets/phase3b/characters/ara3d_assassin.glb
          test -s assets/phase3b/characters/ara3d_trojan.glb
          test -s assets/phase3b/characters/ara3d_warrior.glb
          test -s assets/phase3b/characters/ara3d_taoist.glb
      - name: Syntax-check asset preparation script (no Google Drive dependencies)
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check "huggingface_hub>=0.26,<1.0"
          python3 -m py_compile ci/prepare_phase3b_assets.py
      - name: Fetch pinned Quaternius CC0 packs from GitHub and approved OGA archives
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python3 ci/prepare_phase3b_assets.py 2>&1 | tee artifacts/phase3b_asset_prepare.log
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          result = api.upload_folder(repo_id="ZzwahwahzZ/clash-of-legends-terrain-assets", repo_type="dataset", folder_path="assets/phase3b/characters", path_in_repo="characters", commit_message="add(phase3b): publish five audited high-detail CC0 humanoids")
          oid = getattr(result, "oid", None)
          if not oid:
              raise RuntimeError("Hugging Face character upload did not return a commit OID")
          print("PHASE3B_HF_CHARACTERS_UPLOAD_COMPLETE:", oid)
          PY
          test -s artifacts/phase3b_asset_report.json
          test -s assets/phase3b/quaternius_archer.glb
          test -s assets/phase3b/quaternius_assassin.glb
          test -s assets/phase3b/quaternius_bow.glb
          test -s assets/phase3b/quaternius_dagger.glb
          find assets/phase3b/monsters -name '*.glb' -type f -size +10k | grep -q .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3b-prepared-assets-${{ github.run_number }}
          path: |
            assets/phase3b/**
            artifacts/phase3b_asset_report.json
            assets/phase3b/characters/character_quality_report.json
            artifacts/phase3b_character_generation.log
            artifacts/ara3d_presets.log
            artifacts/phase3b_asset_prepare.log
            artifacts/phase3b_character_generation.log
            artifacts/ara3d_presets.log
          retention-days: 14
  render-previews:
    name: Import Godot and render ten Phase 3B previews
    needs: prepare-assets
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install rendering dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl unzip xvfb xauth libgl1 libglx-mesa0 libegl1 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2 libpulse0 libfontconfig1 libxkbcommon0
          mkdir -p .cache/godot assets/phase3b artifacts
      - name: Restore Godot 4.3
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o .cache/godot/godot.zip
          unzip -o .cache/godot/godot.zip -d .cache/godot
          chmod +x "$GODOT_BIN"
      - uses: actions/download-artifact@v4
        with:
          name: phase3b-prepared-assets-${{ github.run_number }}
          path: .
      - name: Validate models and import project
        run: |
          set -euo pipefail
          find assets/phase3b -name '*.glb' -type f -size +10k
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --import --quit 2>&1 | tee artifacts/phase3b_import.log
          test -s assets/phase3b/characters/character_quality_report.json
      - name: Render ten hero, monster and weapon previews
        run: |
          set -euo pipefail
          LIBGL_ALWAYS_SOFTWARE=1 CI_CAPTURE=1 xvfb-run -a -s "-screen 0 960x540x24" timeout 300s "$GODOT_BIN" --path "$GITHUB_WORKSPACE" --rendering-driver opengl3 --audio-driver Dummy --resolution 960x540 res://scenes/Phase3BPreview.tscn 2>&1 | tee artifacts/phase3b_render.log
          for image in phase3b_01_archer_bow.png phase3b_02_oriental_assassin_dual_knives.png phase3b_03_dual_blades_axes.png phase3b_04_spear_halberd_greatsword_shield.png phase3b_05_mage_magic_staff.png phase3b_06_ninja_katana_shuriken_plus12.png phase3b_07_oga_dragon_daylight.png phase3b_08_quaternius_dragon_daylight.png phase3b_09_quaternius_demon_daylight.png phase3b_10_weapon_collection.png; do
            test -s "artifacts/$image"
            size=$(stat -c%s "artifacts/$image")
            [ "$size" -gt 15000 ] || { echo "::error::Preview image $image is too small"; exit 1; }
          done
          grep -q "PHASE3B_ALL_TEN_CAPTURES_COMPLETE" artifacts/phase3b_render.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script|PHASE3B_CAPTURE_FAILED" artifacts/phase3b_render.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3b-ten-previews-${{ github.run_number }}
          path: |
            artifacts/phase3b_01_archer_bow.png
            artifacts/phase3b_02_oriental_assassin_dual_knives.png
            artifacts/phase3b_03_dual_blades_axes.png
            artifacts/phase3b_04_spear_halberd_greatsword_shield.png
            artifacts/phase3b_05_mage_magic_staff.png
            artifacts/phase3b_06_ninja_katana_shuriken_plus12.png
            artifacts/phase3b_07_oga_dragon_daylight.png
            artifacts/phase3b_08_quaternius_dragon_daylight.png
            artifacts/phase3b_09_quaternius_demon_daylight.png
            artifacts/phase3b_10_weapon_collection.png
            artifacts/phase3b_asset_report.json
            artifacts/phase3b_asset_prepare.log
            artifacts/phase3b_import.log
            artifacts/phase3b_render.log
          retention-days: 14
