name: Phase 5A Mobile HUD Quick Preview

on:
  push:
    branches: ['test/phase5-mobile-ui-audio-apk']
    paths:
      - '.github/workflows/phase5a-mobile-hud-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase5a-mobile-hud-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"
  GODOT_BIN: ".cache/godot/Godot_v4.3-stable_linux.x86_64"
  LIBGL_ALWAYS_SOFTWARE: "1"

jobs:
  mobile-hud-preview:
    name: Render inventory and character UI previews only
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install rendering runtime dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl unzip xvfb xauth libgl1 libglx-mesa0 libegl1 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2 libpulse0 libfontconfig1 libxkbcommon0
          sudo rm -rf /var/lib/apt/lists/*
          mkdir -p .cache/godot artifacts

      - name: Restore Godot 4.3 cache
        uses: actions/cache@v4
        with:
          path: .cache/godot
          key: godot-4.3-linux-x64-v1

      - name: Install Godot 4.3 if cache is empty
        run: |
          set -euo pipefail
          if [ ! -x "$GODOT_BIN" ]; then
            curl --fail --location --retry 4 --retry-all-errors "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o .cache/godot/godot.zip
            unzip -o .cache/godot/godot.zip -d .cache/godot
            chmod +x "$GODOT_BIN"
          fi
          "$GODOT_BIN" --version

      - name: Restore approved Phase 5A mobile UI artwork and Arabic font
        id: mobile_ui
        uses: actions/cache@v4
        with:
          path: |
            assets/ui
            assets/icons
            assets/fonts
          key: phase5a-mobile-ui-assets-v9-real-equipment-icons

      - name: Restore Godot imported resources
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot43-imported-v2-${{ hashFiles('project.godot', 'scenes/**/*.tscn', 'scripts/**/*.gd') }}
          restore-keys: |
            godot43-imported-v2-

      - name: Diagnose UI cache and restore invalid approved assets (fallback)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/ui/borders assets/icons/rpg assets/fonts
          needs_restore=0
          for file in assets/ui/borders/ornate_panel.png assets/icons/rpg/helmet.png assets/fonts/NotoSansArabic-Bold.ttf; do
            bytes=0
            [ -f "$file" ] && bytes=$(stat -c%s "$file")
            if [ "$bytes" -gt 500 ]; then
              echo "PHASE5A_UI_ASSET_PRESENT: $file bytes=$bytes"
            else
              echo "::warning::PHASE5A_UI_ASSET_INVALID_OR_MISSING: $file bytes=$bytes"
              needs_restore=1
            fi
          done

          if [ "$needs_restore" -eq 1 ]; then
            echo "PHASE5A_UI_ASSET_FALLBACK_DOWNLOAD_STARTED"
            rm -rf /tmp/kenney
            trap 'rm -rf /tmp/kenney' EXIT
            git clone --depth 1 https://github.com/shorepine/kenney.git /tmp/kenney

            # Restore the exact approved ornate fantasy frame from the primary workflow's asset source.
            for candidate in \
              "/tmp/kenney/ui/Fantasy UI Borders/Border/panel-border-018.png" \
              "/tmp/kenney/ui/Fantasy UI Borders/Border/panel-border-000.png"; do
              if [ -f "$candidate" ] && [ "$(stat -c%s "$candidate")" -gt 500 ] && [ "$(od -An -tx1 -N8 "$candidate" | tr -d ' \n')" = "89504e470d0a1a0a" ]; then
                cp "$candidate" assets/ui/borders/ornate_panel.png
                echo "PHASE5A_ORNATE_FRAME_RESTORED: $candidate"
                break
              fi
            done

            # Select a real, valid helmet/hood PNG from the same indexed Kenney artwork set.
            python3 -c 'import pathlib,re,shutil,sys; root=pathlib.Path("/tmp/kenney"); idx=root/"index.tsv"; rows=idx.read_text(encoding="utf-8").splitlines() if idx.is_file() else []; candidates=[(root/p.split("\t",1)[0],p.split("\t",1)[0]) for p in rows if len(p.split("\t",1))==2 and re.search(r"helmet|hood|crown|hat",p,re.I) and p.split("\t",1)[0].lower().endswith(".png")]; valid=[(f,r) for f,r in candidates if f.is_file() and f.stat().st_size>500 and f.read_bytes()[:8]==bytes.fromhex("89504e470d0a1a0a")]; valid.sort(key=lambda x:(0 if "icon" in x[1].lower() else 1,len(x[1]),x[1])); (shutil.copy2(valid[0][0],"assets/icons/rpg/helmet.png"),print("PHASE5A_HELMET_RESTORED:",valid[0][1])) if valid else sys.exit("No valid helmet/hood PNG found in Kenney index.tsv")'

            for file in assets/ui/borders/ornate_panel.png assets/icons/rpg/helmet.png; do
              bytes=$(stat -c%s "$file")
              [ "$bytes" -gt 500 ] || { echo "::error::Restored asset too small: $file ($bytes bytes)"; exit 1; }
              signature=$(od -An -tx1 -N8 "$file" | tr -d ' \n')
              [ "$signature" = "89504e470d0a1a0a" ] || { echo "::error::Invalid PNG signature: $file"; exit 1; }
              echo "PHASE5A_UI_ASSET_RESTORED_OK: $file bytes=$bytes"
            done

            font_bytes=0
            [ -f assets/fonts/NotoSansArabic-Bold.ttf ] && font_bytes=$(stat -c%s assets/fonts/NotoSansArabic-Bold.ttf)
            if [ "$font_bytes" -le 500 ]; then
              curl --fail --location --retry 4 --retry-all-errors "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansarabic/NotoSansArabic%5Bwdth%2Cwght%5D.ttf" -o assets/fonts/NotoSansArabic-Bold.ttf
            fi
          else
            echo "PHASE5A_UI_ASSET_FALLBACK_NOT_NEEDED"
          fi

          for file in assets/ui/borders/ornate_panel.png assets/icons/rpg/helmet.png assets/fonts/NotoSansArabic-Bold.ttf; do
            bytes=$(stat -c%s "$file")
            [ "$bytes" -gt 500 ] || { echo "::error::Required asset invalid or too small: $file ($bytes bytes)"; exit 1; }
            echo "PHASE5A_UI_ASSET_FINAL_OK: $file bytes=$bytes"
          done

      - name: Verify cached UI assets and import project
        run: |
          set -euo pipefail
          for file in assets/ui/borders/ornate_panel.png assets/icons/rpg/helmet.png assets/fonts/NotoSansArabic-Bold.ttf; do
            if [ -s "$file" ]; then echo "PHASE5A_UI_ASSET_VERIFY_PRESENT: $file bytes=$(stat -c%s "$file")"; else echo "::error::PHASE5A_UI_ASSET_VERIFY_MISSING: $file"; exit 1; fi
          done
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --import --quit 2>&1 | tee artifacts/mobile_hud_import.log

      - name: Render MobileHUD inventory and character previews only
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1600x900x24" timeout 600s "$GODOT_BIN" --path "$GITHUB_WORKSPACE" --rendering-driver opengl3 --audio-driver Dummy --resolution 1600x900 -- --preview-mobile-hud 2>&1 | tee artifacts/mobile_hud_preview.log
          test -s artifacts/mobile_hud_inventory_preview.png
          test -s artifacts/mobile_hud_character_preview.png
          for image in mobile_hud_inventory_preview.png mobile_hud_character_preview.png; do
            size=$(stat -c%s "artifacts/$image")
            [ "$size" -gt 1024 ] || { echo "::error::Mobile HUD preview $image is too small: $size bytes"; exit 1; }
            file "artifacts/$image"
          done
          grep -q "PHASE5A_MOBILE_HUD_PREVIEW_CAPTURE_OK: inventory=true character=true icons=true" artifacts/mobile_hud_preview.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script|PHASE5A_MOBILE_HUD_PREVIEW_FAILED" artifacts/mobile_hud_preview.log

      - name: Upload both mobile HUD preview PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-hud-previews-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/mobile_hud_inventory_preview.png
            artifacts/mobile_hud_character_preview.png
            artifacts/mobile_hud_preview.log
            artifacts/mobile_hud_import.log
