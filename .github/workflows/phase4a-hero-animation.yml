name: Phase 4A Hero Animation Build and Pose Review
on:
  workflow_dispatch:
  push:
    branches: ['test/phase4a-hero-movement']
    paths:
      - 'scripts/animation/ConquerHeroAnimationBuilder.gd'
      - 'scripts/animation/ConquerHeroPoseRenderer.gd'
      - '.github/workflows/phase4a-hero-animation.yml'
permissions:
  contents: read
concurrency:
  group: phase4a-hero-animation-${{ github.ref }}
  cancel-in-progress: true
env:
  GODOT_VERSION: "4.3"
  GODOT_BIN: ".cache/godot/Godot_v4.3-stable_linux.x86_64"
  LIBGL_ALWAYS_SOFTWARE: "1"
  CI_CAPTURE: "1"
jobs:
  build-and-render:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/phase4a-hero-movement
      - name: Install Godot 4.3 and rendering dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl unzip xvfb xauth libgl1 libglx-mesa0 libegl1 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2 libpulse0 libfontconfig1 libxkbcommon0 python3-pip
          mkdir -p .cache/godot assets/phase3b/characters assets/phase4/animations artifacts
          curl -L --fail --retry 4 --retry-all-errors "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o .cache/godot/godot.zip
          unzip -o .cache/godot/godot.zip -d .cache/godot
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version
          python3 -m pip install --disable-pip-version-check "huggingface_hub>=0.26,<1.0"
      - name: Fetch approved Phase 3B hero GLBs from Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo "::error::HF_TOKEN secret is missing"; exit 1; }
          python3 - <<'PY'
          import os, pathlib, shutil
          from huggingface_hub import snapshot_download
          root = pathlib.Path(snapshot_download(
              repo_id="ZzwahwahzZ/clash-of-legends-terrain-assets",
              repo_type="dataset", token=os.environ["HF_TOKEN"],
              allow_patterns=["phase3b/**", "characters/**"]
          ))
          candidates = [root / "phase3b" / "characters", root / "characters"]
          source = next((p for p in candidates if p.is_dir()), None)
          if source is None:
              raise SystemExit("HF repository has no phase3b/characters or characters directory")
          target = pathlib.Path("assets/phase3b/characters")
          target.mkdir(parents=True, exist_ok=True)
          for item in source.iterdir():
              dest = target / item.name
              if item.is_dir(): shutil.copytree(item, dest, dirs_exist_ok=True)
              else: shutil.copy2(item, dest)
          required = ["archer_male.glb", "archer_female.glb"]
          for name in required:
              path = target / name
              if not path.is_file() or path.stat().st_size < 10000:
                  raise SystemExit(f"Required hero GLB missing/invalid: {path}")
          print("PHASE4A_HF_HERO_DOWNLOAD_OK:", len(list(target.glob("*.glb"))), "GLBs")
          PY
      - name: Import hero models and inspect the unified skeleton
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --import --quit 2>&1 | tee artifacts/godot_import.log
          python3 - <<'PY'
          import json, struct, pathlib
          required = {"pelvis","spine_01","spine_02","spine_03","neck_01","Head","clavicle_l","clavicle_r","upperarm_l","upperarm_r","lowerarm_l","lowerarm_r","hand_l","hand_r","thigh_l","thigh_r","calf_l","calf_r","foot_l","foot_r"}
          for filename in ("archer_male.glb","archer_female.glb"):
              path=pathlib.Path("assets/phase3b/characters")/filename
              data=path.read_bytes()
              if data[:4] != b"glTF": raise SystemExit(f"Not GLB: {path}")
              length=struct.unpack_from("<I",data,12)[0]
              doc=json.loads(data[20:20+length])
              skins=doc.get("skins",[])
              if not skins: raise SystemExit(f"No skin in {filename}")
              nodes=doc.get("nodes",[])
              names={nodes[i].get("name","") for i in skins[0].get("joints",[])}
              missing=required-names
              if missing: raise SystemExit(f"{filename} missing unified bones: {sorted(missing)}")
              print("PHASE4A_SKELETON_OK:",filename,"bones=",len(names))
          PY
      - name: Build and reload the real AnimationLibrary in Godot 4.3
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --script res://scripts/animation/ConquerHeroAnimationBuilder.gd 2>&1 | tee artifacts/animation_build.log
          test -s assets/phase4/animations/conquer_hero_anims.res
          grep -q "PHASE4A_ANIMATION_LIBRARY_OK" artifacts/animation_build.log
          cp assets/phase4/animations/conquer_hero_anims.res artifacts/conquer_hero_anims.res
      - name: Render six approved hero poses in Godot 4.3 under Xvfb
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" "$GODOT_BIN" --path "$GITHUB_WORKSPACE" --script res://scripts/animation/ConquerHeroPoseRenderer.gd 2>&1 | tee artifacts/pose_render.log
          test -s artifacts/hero_pose_review.png
          grep -q "PHASE4A_POSE_RENDER_OK" artifacts/pose_render.log
      - name: Upload real Godot animation and pose review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4a-hero-pose-review
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/conquer_hero_anims.res
            artifacts/hero_pose_review.png
            artifacts/godot_import.log
            artifacts/animation_build.log
            artifacts/pose_render.log
