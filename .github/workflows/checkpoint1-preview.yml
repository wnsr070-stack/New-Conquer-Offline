name: Twin City Checkpoint 1 Preview

on:
  push:
    branches:
      - 'test/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkpoint1-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  twin-city-build-and-capture:
    name: Godot 4.3 build and six captures
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GODOT_VERSION: "4.3"
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_ASSET_CACHE_DIR: ${{ github.workspace }}/.cache/hf-assets
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
      LIBGL_ALWAYS_SOFTWARE: "1"
      CI_CAPTURE: "1"
    steps:
      - name: Checkout checkpoint branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl unzip python3-pip python3-venv \
            xvfb xauth libgl1 libglx-mesa0 libegl1 libx11-6 \
            libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2 \
            libpulse0 libfontconfig1 libxkbcommon0 nodejs npm
          sudo rm -rf /var/lib/apt/lists/*
          mkdir -p .cache/godot artifacts

      - name: Install Python and gltfpack
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check \
            --cache-dir "$PIP_CACHE_DIR" "huggingface_hub>=0.26,<1.0" requests
          sudo npm install --global gltfpack
          command -v gltfpack

      - name: Download Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          GODOT_BIN=".cache/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          if [ ! -x "$GODOT_BIN" ]; then
            curl --fail --location --retry 3 \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
              --output .cache/godot/godot.zip
            unzip -o .cache/godot/godot.zip -d .cache/godot
            chmod +x "$GODOT_BIN"
          fi
          "$GODOT_BIN" --version
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Fetch verified Hugging Face assets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::GitHub Actions secret HF_TOKEN is missing."
            exit 1
          fi
          .venv/bin/python ci/fetch_assets.py 2>&1 | tee artifacts/asset_fetch.log

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --import --quit

      - name: Render Twin City and capture six views
        shell: bash
        run: |
          set -euo pipefail
          export LIBGL_ALWAYS_SOFTWARE=1
          CI_CAPTURE=1 xvfb-run -a -s "-screen 0 1280x720x24" \
            timeout 300s "$GODOT_BIN" --path "$GITHUB_WORKSPACE" \
            --rendering-driver opengl3 --audio-driver Dummy \
            --resolution 1280x720 res://scenes/TwinCity.tscn \
            2>&1 | tee artifacts/godot.log

      - name: Upload preview images and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twin-city-checkpoint1-preview-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/twin_city_overview.png
            artifacts/twin_city_palace.png
            artifacts/twin_city_ne_pagoda.png
            artifacts/twin_city_nw_quest_hall.png
            artifacts/twin_city_se_tea_house.png
            artifacts/twin_city_sw_blacksmith.png
            artifacts/landmarks_preview.png
            artifacts/landmark_sources.txt
            artifacts/godot.log
            artifacts/asset_fetch.log

      - name: Verify all six captures and checkpoint markers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for image in \
            twin_city_overview.png \
            twin_city_palace.png \
            twin_city_ne_pagoda.png \
            twin_city_nw_quest_hall.png \
            twin_city_se_tea_house.png \
            twin_city_sw_blacksmith.png; do
            test -s "artifacts/$image"
          done
          test -s artifacts/landmark_sources.txt
          grep -q "CHECKPOINT1_UNIFIED_DIRT_GROUND_OK:" artifacts/godot.log
          grep -q "CHECKPOINT1_COBBLESTONE_PLAZA_OK:" artifacts/godot.log
          grep -q "CHECKPOINT1_COBBLE_RUNTIME_IMAGE_TEXTURES_OK:" artifacts/godot.log
          grep -Eq "CHECKPOINT1_EASTERN_GATE_(GLTF_APPEND_OK|OMITTED_NO_VERIFIED_MODEL)" artifacts/godot.log
          grep -q "CHECKPOINT1_BLACKSMITH_GLTF_APPEND_OK" artifacts/godot.log
          grep -q "CHECKPOINT1_ALL_SIX_CAPTURES_COMPLETE" artifacts/godot.log
          grep -q "CHECKPOINT1_PALACE_PLATFORM_OK:" artifacts/godot.log
          grep -q "CHECKPOINT1_ROTATED_AABB_REJECTION_OK:" artifacts/godot.log
          grep -q "CHECKPOINT1_ROTATED_AABB_AUTO_OFFSET_OK:" artifacts/godot.log
          grep -q "CHECKPOINT1_LANDMARK_OK: NE_PAGODA" artifacts/godot.log
          grep -q "CHECKPOINT1_LANDMARK_OK: NW_QUEST_HALL" artifacts/godot.log
          grep -q "CHECKPOINT1_LANDMARK_OK: SE_TEA_HOUSE" artifacts/godot.log
          grep -q "CHECKPOINT1_LANDMARK_OK: SW_BLACKSMITH" artifacts/godot.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|TWIN_CITY_CAPTURE_FAILED|LANDMARKS_PREVIEW_FAILED|GLB import failed|ARCHITECTURE_WHITELIST_VIOLATION" artifacts/godot.log

