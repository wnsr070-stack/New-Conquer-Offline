name: Twin City Checkpoint 1 Preview
on:
  push:
    branches: ['test/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checkpoint1-preview-${{ github.ref }}
  cancel-in-progress: true
env:
  GODOT_VERSION: "4.3"
  GODOT_BIN: ".cache/godot/Godot_v4.3-stable_linux.x86_64"
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  HF_ASSET_CACHE_DIR: ${{ github.workspace }}/.cache/hf-assets
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
  LIBGL_ALWAYS_SOFTWARE: "1"
  CI_CAPTURE: "1"
jobs:
  prepare-assets-and-tools:
    name: Prepare cached Godot, gltfpack and verified assets
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Cache Godot 4.3
        uses: actions/cache@v4
        with:
          path: .cache/godot
          key: godot-4.3-linux-x64-v1
      - name: Cache gltfpack
        uses: actions/cache@v4
        with:
          path: .cache/tools
          key: twin-city-tools-linux-v1
      - name: Cache Phase 5 mount GLB models
        id: mount_models
        uses: actions/cache@v4
        with:
          path: assets/mounts
          key: phase5-mount-glb-v5-saddle-assassin-${{ hashFiles('scripts/MountSystem.gd', 'scripts/HeroController.gd') }}
      - name: Cache Hugging Face and external assets
        id: assets
        uses: actions/cache@v4
        with:
          path: .cache/hf-assets
          key: wilderness-hf-assets-v6-${{ hashFiles('ci/fetch_assets.py', 'ci/prepare_wilderness.py') }}
      - name: Install preparation dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl unzip python3-pip python3-venv
          sudo rm -rf /var/lib/apt/lists/*
          mkdir -p .cache/godot .cache/tools .cache/hf-assets artifacts
      - name: Install Godot if cache is empty
        run: |
          set -euo pipefail
          if [ ! -x "$GODOT_BIN" ]; then
            curl --fail --location --retry 4 --retry-all-errors "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o .cache/godot/godot.zip
            unzip -o .cache/godot/godot.zip -d .cache/godot
            chmod +x "$GODOT_BIN"
          fi
          "$GODOT_BIN" --version
      - name: Install gltfpack if cache is empty
        run: |
          set -euo pipefail
          if [ ! -x .cache/tools/bin/gltfpack ]; then npm install --global --prefix "$GITHUB_WORKSPACE/.cache/tools" gltfpack; fi
          export PATH="$GITHUB_WORKSPACE/.cache/tools/bin:$PATH"
          command -v gltfpack
          echo "$GITHUB_WORKSPACE/.cache/tools/bin" >> "$GITHUB_PATH"
      - name: Fetch and validate three approved mounts, CC0 saddle and rigged Ninja hero GLB
        if: steps.mount_models.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p assets/mounts /tmp/phase5-mounts
          base="https://raw.githubusercontent.com/nishit47/Blender-Pre-vis-Pipeline---Screenplay-to-Animatic/main/assets/Animated%20Animal%20Pack-glb"
          prepare_model() {
            local source="$1" target_name="$2"
            local target="assets/mounts/${target_name}"
            local bytes signature packed_bytes
            bytes=$(stat -c%s "$source")
            [ "$bytes" -gt 30720 ] || { echo "::error::Mount source GLB below 30KB: $source bytes=$bytes"; return 1; }
            signature=$(od -An -tx1 -N4 "$source" | tr -d ' \n')
            [ "$signature" = "676c5446" ] || { echo "::error::Mount source is not a binary GLB: $source"; return 1; }
            echo "MOUNT_SOURCE_GLB_VALID: $source bytes=$bytes"
            gltfpack -i "$source" -o "$target" -noq
            packed_bytes=$(stat -c%s "$target")
            [ "$packed_bytes" -gt 30720 ] || { echo "::error::Optimized mount GLB below 30KB: $target bytes=$packed_bytes"; return 1; }
            signature=$(od -An -tx1 -N4 "$target" | tr -d ' \n')
            [ "$signature" = "676c5446" ] || { echo "::error::Optimized mount is not a binary GLB: $target"; return 1; }
            echo "MOUNT_MODEL_CACHE_READY: $target_name bytes=$packed_bytes compression=no_quantization"
          }
          if ! curl --fail --location --retry 2 --retry-all-errors "$base/Horse.glb" -o /tmp/phase5-mounts/Horse.glb; then
            echo "::warning::Primary Horse.glb unavailable; using Three.js official fallback"
            curl --fail --location --retry 4 --retry-all-errors "https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/Horse.glb" -o /tmp/phase5-mounts/Horse.glb
          fi
          if [ "$(stat -c%s /tmp/phase5-mounts/Horse.glb)" -le 30720 ]; then
            echo "::warning::Primary Horse.glb is below 30KB; retrying with Three.js fallback"
            curl --fail --location --retry 4 --retry-all-errors "https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/Horse.glb" -o /tmp/phase5-mounts/Horse.glb
          fi
          prepare_model /tmp/phase5-mounts/Horse.glb steed_horse.glb
          for pair in "Stag.glb mount_deer.glb" "Wolf.glb mount_wolf.glb"; do
            read -r source_name target_name <<< "$pair"
            curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 "$base/$source_name" -o "/tmp/phase5-mounts/$source_name"
            prepare_model "/tmp/phase5-mounts/$source_name" "$target_name"
          done
          saddle_url="https://cdn.3dassets.dev/assets/24014/v1/model.glb"
          curl --fail --location --retry 4 --retry-all-errors "$saddle_url" -o /tmp/phase5-mounts/saddle-source.glb
          saddle_bytes=$(stat -c%s /tmp/phase5-mounts/saddle-source.glb)
          [ "$saddle_bytes" -ge 20000 ] || { echo "::error::CC0 saddle pad source unexpectedly small: $saddle_bytes"; exit 1; }
          [ "$(od -An -tx1 -N4 /tmp/phase5-mounts/saddle-source.glb | tr -d ' \\n')" = "676c5446" ] || { echo "::error::Saddle source is not GLB"; exit 1; }
          gltfpack -noq -i /tmp/phase5-mounts/saddle-source.glb -o assets/mounts/saddle.glb
          saddle_packed=$(stat -c%s assets/mounts/saddle.glb)
          [ "$saddle_packed" -gt 10000 ] || { echo "::error::Optimized saddle GLB below 10KB: $saddle_packed"; exit 1; }
          echo "CC0_SADDLE_PAD_CACHE_READY: bytes=$saddle_packed source_bytes=$saddle_bytes license=CC0"
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 "https://grab3d.com/dl/ninja-rigged/ninja-rigged.glb" -o /tmp/phase5-mounts/ninja-rigged.glb
          prepare_model /tmp/phase5-mounts/ninja-rigged.glb hero_assassin.glb
          python3 - <<'PY'
          import pathlib, struct, json
          path=pathlib.Path("assets/mounts/hero_assassin.glb")
          data=path.read_bytes()
          if len(data)<30000 or data[:4]!=b"glTF": raise SystemExit("Invalid hero_assassin.glb binary GLB")
          magic,version,total=struct.unpack_from("<4sII",data,0)
          chunk_len,chunk_type=struct.unpack_from("<II",data,12)
          doc=json.loads(data[20:20+chunk_len].decode("utf-8").rstrip(" \\0"))
          clips=[str(item.get("name","")).lower() for item in doc.get("animations",[])]
          if version!=2 or total!=len(data) or not doc.get("skins"): raise SystemExit("Ninja GLB has no valid skinned rig")
          if not any("walk" in clip for clip in clips) or not any("run" in clip for clip in clips):
              raise SystemExit("Ninja GLB must contain Walk and Run clips: "+repr(clips))
          print("HERO_ASSASSIN_RIGGED_GLB_VERIFIED: bytes=",len(data),"skins=",len(doc["skins"]),"animations=",clips)
          PY
          for file in steed_horse.glb mount_deer.glb mount_wolf.glb saddle.glb hero_assassin.glb; do
            test -s "assets/mounts/$file"
            echo "PHASE5A_MODEL_ASSET_OK: $file bytes=$(stat -c%s "assets/mounts/$file")"
          done
          rm -rf /tmp/phase5-mounts
      - name: Install Python fetch dependencies
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir "huggingface_hub>=0.26,<1.0" hf_transfer requests
      - name: Fetch approved assets only on cache miss
        if: steps.assets.outputs.cache-hit != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_ENABLE_HF_TRANSFER: "1"
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo "::error::HF_TOKEN secret is missing"; exit 1; }
          .venv/bin/python ci/fetch_assets.py 2>&1 | tee artifacts/asset_fetch.log
          test -s .cache/hf-assets/twin_city_runtime_assets.json
          test -s artifacts/landmark_sources.txt
          cp artifacts/landmark_sources.txt .cache/hf-assets/landmark_sources.txt
      - name: Prepare Checkpoint 2 terrain assets and upload CC0 textures
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          .venv/bin/python ci/prepare_wilderness.py 2>&1 | tee artifacts/wilderness_prepare.log
          test -s .cache/hf-assets/wilderness_checkpoint2_manifest.json
          test -s artifacts/wilderness_asset_report.json
      - name: Reuse cached asset source report
        if: steps.assets.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          test -s .cache/hf-assets/twin_city_runtime_assets.json
          test -s .cache/hf-assets/landmark_sources.txt
          cp .cache/hf-assets/landmark_sources.txt artifacts/landmark_sources.txt
          echo "HF_ASSET_CACHE_HIT: no asset re-download required"
      - name: Upload preparation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twin-city-asset-preparation-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            artifacts/asset_fetch.log
            artifacts/landmark_sources.txt

  render-checkpoint1:
    name: Import project and render six Twin City views
    needs: prepare-assets-and-tools
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install rendering runtime dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl unzip xvfb xauth libgl1 libglx-mesa0 libegl1 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2 libpulse0 libfontconfig1 libxkbcommon0
          sudo rm -rf /var/lib/apt/lists/*
          mkdir -p .cache/godot .cache/tools .cache/hf-assets artifacts
      - name: Restore Godot 4.3 cache
        uses: actions/cache@v4
        with:
          path: .cache/godot
          key: godot-4.3-linux-x64-v1
      - name: Restore gltfpack cache
        uses: actions/cache@v4
        with:
          path: .cache/tools
          key: twin-city-tools-linux-v1
      - name: Restore three mount GLB models
        uses: actions/cache@v4
        with:
          path: assets/mounts
          key: phase5-mount-glb-v5-saddle-assassin-${{ hashFiles('scripts/MountSystem.gd', 'scripts/HeroController.gd') }}
      - name: Restore approved asset cache
        uses: actions/cache@v4
        with:
          path: .cache/hf-assets
          key: wilderness-hf-assets-v6-${{ hashFiles('ci/fetch_assets.py', 'ci/prepare_wilderness.py') }}
      - name: Restore Godot imported resources
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot43-imported-v2-${{ hashFiles('project.godot', 'scenes/**/*.tscn', 'scripts/**/*.gd') }}
          restore-keys: |
            godot43-imported-v2-
      - name: Verify prepared cache
        run: |
          set -euo pipefail
          test -x "$GODOT_BIN"
          "$GODOT_BIN" --version
          test -s .cache/hf-assets/twin_city_runtime_assets.json
          test -s .cache/hf-assets/landmark_sources.txt
          test -x .cache/tools/bin/gltfpack
          for file in steed_horse.glb mount_deer.glb mount_wolf.glb saddle.glb hero_assassin.glb; do
            test -s "assets/mounts/$file" || { echo "::error::Restored model missing: $file"; exit 1; }
            bytes=$(stat -c%s "assets/mounts/$file")
            if [ "$file" = "saddle.glb" ]; then [ "$bytes" -gt 10000 ] || { echo "::error::Restored saddle below 10KB: $bytes"; exit 1; }; else [ "$bytes" -gt 30720 ] || { echo "::error::Restored mount model below 30KB: $file bytes=$bytes"; exit 1; }; fi
            echo "MOUNT_MODEL_RESTORED_OK: $file bytes=$bytes"
          done
          cp .cache/hf-assets/landmark_sources.txt artifacts/landmark_sources.txt
          echo PREPARED_ASSETS_AND_TOOLS_READY
      - name: Fetch approved NPC Ranger and class weapons
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo "::error::HF_TOKEN secret is missing"; exit 1; }
          python3 -m pip install --disable-pip-version-check "huggingface_hub>=0.26,<1.0"
          python3 - <<'PY'
          import pathlib, shutil, os
          from huggingface_hub import hf_hub_download
          repo = "ZzwahwahzZ/clash-of-legends-terrain-assets"
          targets = {
              "phase3b/characters/archer_male.glb": "assets/phase3b/characters/Male_Ranger.glb",
              "phase3b/characters/archer_female.glb": "assets/phase3b/characters/Female_Ranger.glb",
              "phase3b/weapons/bow_beginner.glb": "assets/phase3b/weapons/bow_beginner.glb",
              "phase3b/weapons/dual_knives_beginner.glb": "assets/phase3b/weapons/dual_knives_beginner.glb",
              "phase3b/weapons/dual_blades_beginner.glb": "assets/phase3b/weapons/dual_blades_beginner.glb",
              "phase3b/weapons/shield_beginner.glb": "assets/phase3b/weapons/shield_beginner.glb",
              "phase3b/weapons/greatsword_beginner.glb": "assets/phase3b/weapons/greatsword_beginner.glb",
              "phase3b/weapons/magic_staff_beginner.glb": "assets/phase3b/weapons/magic_staff_beginner.glb",
          }
          for source, target in targets.items():
              downloaded = pathlib.Path(hf_hub_download(repo_id=repo, repo_type="dataset", filename=source, token=os.environ["HF_TOKEN"]))
              destination = pathlib.Path(target)
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(downloaded, destination)
              data = destination.read_bytes()
              if len(data) < 10000 or data[:4] != b"glTF":
                  raise SystemExit("Invalid approved hero/weapon GLB: " + target)
              print("TWIN_CITY_HERO_ASSET_OK:", target, "bytes=", len(data))
          PY
      - name: Cache Phase 5A mobile UI assets
        id: mobile_ui_assets
        uses: actions/cache@v4
        with:
          path: |
            assets/ui
            assets/icons
            assets/fonts
          key: phase5a-mobile-ui-assets-v9-real-equipment-icons
      - name: Fetch real Kenney RPG icons, ornate fantasy frame and menu artwork
        run: |
          set -euo pipefail
          mkdir -p assets/ui/borders assets/ui/slots assets/ui/buttons assets/ui/skills assets/ui/menu assets/icons/rpg assets/fonts
          rm -rf /tmp/kenney
          trap 'rm -rf /tmp/kenney' EXIT
          git clone --depth 1 https://github.com/shorepine/kenney.git /tmp/kenney
          python3 - <<'PY'
          import pathlib, shutil, re, csv
          
          root = pathlib.Path("/tmp/kenney").resolve()
          index_path = root / "index.tsv"
          if not index_path.is_file():
              raise SystemExit("Kenney index.tsv is missing")
          
          excluded = {"tank", "car", "vehicle", "steering", "space", "alien", "ship", "ufo", "plane"}
          split_words = re.compile(r"[_\\-\\s/\\.]+")
          
          def png_ok(path):
              try:
                  data = path.read_bytes()
                  return len(data) > 100 and data[:8] == bytes.fromhex("89504e470d0a1a0a")
              except OSError:
                  return False
          
          # index.tsv columns: path, description, WxH, bytes
          indexed = []
          with index_path.open("r", encoding="utf-8", newline="") as stream:
              for line in stream:
                  parts = line.rstrip("\r\n").split(chr(9))
                  if len(parts) < 2:
                      continue
                  rel, description = parts[0].strip(), parts[1].strip()
                  if not rel or rel.lower() == "path":
                      continue
                  tokens = set(split_words.split((rel + " " + description).lower()))
                  if tokens & excluded:
                      continue
                  if pathlib.PurePosixPath(rel).suffix.lower() != ".png":
                      continue
                  source = (root / rel).resolve()
                  if root not in source.parents or not source.is_file() or not png_ok(source):
                      continue
                  indexed.append((source, tokens, rel.lower(), description.lower()))
          
          if not indexed:
              raise SystemExit("Kenney index.tsv yielded no valid non-vehicle PNG artwork")
          
          def copy_png(source, destination):
              target = pathlib.Path(destination)
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              print(f"PHASE5A_REAL_ART_OK: {target} bytes={target.stat().st_size} source={source}")
          
          # One authoritative ornate frame, copied to both consumers.
          border_candidates = [
              root / "ui" / "Fantasy UI Borders" / "Border" / "panel-border-018.png",
              root / "ui" / "Fantasy UI Borders" / "Border" / "panel-border-000.png",
          ]
          border = next((p for p in border_candidates if p.is_file() and png_ok(p)), None)
          if border is None:
              raise SystemExit("Required Fantasy UI Borders frame 018/000 is missing or invalid")
          copy_png(border, "assets/ui/borders/ornate_panel.png")
          copy_png(border, "assets/ui/slots/ornate_slot.png")
          
          legacy = {
              "panel_brown.png": "assets/ui/borders/panel_brown.png",
              "panel_beige.png": "assets/ui/borders/panel_beige.png",
              "panelinset_brown.png": "assets/ui/slots/slot_brown.png",
              "panelinset_beige.png": "assets/ui/slots/slot_beige.png",
              "buttonlong_brown.png": "assets/ui/buttons/btn_brown.png",
              "buttonlong_brown_pressed.png": "assets/ui/buttons/btn_brown_pressed.png",
              "buttonsquare_brown.png": "assets/ui/buttons/btn_sq_brown.png",
              "buttonsquare_brown_pressed.png": "assets/ui/buttons/btn_sq_brown_pressed.png"
          }
          for name, target in legacy.items():
              matches = [p for p, _, _, _ in indexed if p.name.lower() == name]
              if matches:
                  copy_png(sorted(matches, key=lambda p: str(p))[0], target)
          
          # Exact token categories; paths and descriptions are both indexed.
          categories = {
              "bow": {"bow", "arrow", "quiver"},
              "sword": {"sword", "blade", "greatsword"},
              "dagger": {"dagger", "knife", "dual"},
              "armor": {"armor", "shield", "chestplate", "tunic", "vest"},
              "helmet": {"helmet", "crown", "hood", "hat"},
              "boots": {"boot", "boots", "shoe"},
              "ring": {"ring", "band"},
              "necklace": {"amulet", "gem", "medal", "necklace", "pendant", "charm"},
              "potion": {"potion", "bottle", "flask", "vial"},
              "gem": {"gem", "crystal", "diamond", "ruby", "emerald"},
              "skill": {"fire", "lightning", "arrow", "star", "flame", "bolt", "wind", "heal", "speed"},
              "fan": {"fan", "handfan", "foldingfan"},
              "tower": {"tower", "shield", "buckler", "crest"},
              "wing": {"wing", "feather", "bird"},
              "steed": {"horse", "steed", "mount", "saddle"},
              "mount_whip": {"whip", "rope", "lasso"},
              "mount_skin": {"horse", "steed", "mount", "saddle", "skin", "dye"},
              "garment": {"clothing", "shirt", "robe", "tunic", "dress", "armor"},
              "weapon_accessory": {"weapon", "bow", "sword", "dagger", "blade", "quiver"}
          }
          
          def ranked_candidates(terms):
              matches = [(p, tokens, rel, desc) for p, tokens, rel, desc in indexed if tokens & terms]
              matches.sort(key=lambda item: (
                  not any(part in item[2] for part in ("/icons/", "/icon/", "/ui/")),
                  len(item[2]), item[2]
              ))
              return matches
          
          # Fallback pool is deliberately limited to icon artwork and weapon/gem-like assets.
          fallback_pool = [
              item for item in indexed
              if ("icon" in item[1] or "/icons/" in item[2] or "/icon/" in item[2])
              and item[1] & {"weapon", "sword", "bow", "dagger", "gem", "crystal", "diamond", "ruby", "emerald"}
          ]
          if not fallback_pool:
              fallback_pool = [item for item in indexed if item[1] & {"weapon", "sword", "bow", "dagger", "gem", "crystal"}]
          if not fallback_pool:
              raise SystemExit("No safe weapon/gem icon fallback exists in Kenney index.tsv")
          
          copied = 0
          used_icon_sources = set()
          for category, terms in categories.items():
              matches = ranked_candidates(terms)
              if not matches:
                  print(f"::warning::No direct indexed match for {category}; selecting a distinct real RPG artwork")
                  matches = fallback_pool
              candidates = [entry for entry in matches if str(entry[0]) not in used_icon_sources]
              if not candidates:
                  candidates = [entry for entry in indexed if str(entry[0]) not in used_icon_sources]
              if not candidates:
                  raise SystemExit("Not enough distinct real PNG artworks for category: " + category)
              source = candidates[0][0]
              used_icon_sources.add(str(source))
              copy_png(source, f"assets/icons/rpg/{category}__1__{source.name}")
              copied += 1
          
          # Required menu artwork: every visible quick action gets a real PNG.
          menu_targets = {
              "settings": {"settings", "gear", "cog", "wrench"},
              "bag": {"bag", "backpack", "inventory", "chest"},
              "quest": {"quest", "scroll", "book", "map"},
              "character": {"character", "person", "portrait", "helmet"},
              "merchant": {"merchant", "shop", "store", "trade", "coin"},
              "skill": {"skill", "magic", "star", "spell", "rune"},
              "hunt": {"hunt", "target", "crosshair", "monster", "bow"},
              "mount": {"horse", "steed", "mount", "saddle", "animal"},
          }
          used_menu_sources = set()
          for label, terms in menu_targets.items():
              matches = ranked_candidates(terms)
              if not matches: matches = fallback_pool
              candidates = [entry for entry in matches if str(entry[0]) not in used_menu_sources]
              if not candidates: candidates = [entry for entry in indexed if str(entry[0]) not in used_menu_sources]
              if not candidates: raise SystemExit("Not enough distinct menu PNG artworks for: " + label)
              source = candidates[0][0]
              used_menu_sources.add(str(source))
              copy_png(source, f"assets/ui/menu/{label}.png")

          # Ten individually named real skill textures for F1-F10.
          skill_targets = {
              "bow": {"bow", "arrow"},
              "arrow": {"arrow", "bow"},
              "fire": {"fire", "flame"},
              "lightning": {"lightning", "bolt"},
              "speed": {"speed", "wind"},
              "shield": {"shield", "armor"},
              "sword": {"sword", "blade", "weapon"},
              "dagger": {"dagger", "knife"},
              "heal": {"heal", "heart", "health", "potion"},
              "poison": {"poison", "skull", "venom"}
          }
          used_skill_sources = set()
          for label, terms in skill_targets.items():
              matches = ranked_candidates(terms)
              if not matches: matches = fallback_pool
              candidates = [entry for entry in matches if str(entry[0]) not in used_skill_sources]
              if not candidates: candidates = [entry for entry in indexed if str(entry[0]) not in used_skill_sources]
              if not candidates: raise SystemExit("Not enough distinct skill PNG artworks for: " + label)
              source = candidates[0][0]
              used_skill_sources.add(str(source))
