name: Twin City Checkpoint 1 Preview
on:
  push:
    branches: ['test/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checkpoint1-preview-${{ github.ref }}
  cancel-in-progress: true
env:
  GODOT_VERSION: "4.3"
  GODOT_BIN: ".cache/godot/Godot_v4.3-stable_linux.x86_64"
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  HF_ASSET_CACHE_DIR: ${{ github.workspace }}/.cache/hf-assets
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
  LIBGL_ALWAYS_SOFTWARE: "1"
  CI_CAPTURE: "1"
jobs:
  prepare-assets-and-tools:
    name: Prepare cached Godot, gltfpack and verified assets
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Cache Godot 4.3
        uses: actions/cache@v4
        with:
          path: .cache/godot
          key: godot-4.3-linux-x64-v1
      - name: Cache gltfpack
        uses: actions/cache@v4
        with:
          path: .cache/tools
          key: twin-city-tools-linux-v1
      - name: Cache Hugging Face and external assets
        id: assets
        uses: actions/cache@v4
        with:
          path: .cache/hf-assets
          key: wilderness-hf-assets-v6-${{ hashFiles('ci/fetch_assets.py', 'ci/prepare_wilderness.py') }}
      - name: Install preparation dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl unzip python3-pip python3-venv
          sudo rm -rf /var/lib/apt/lists/*
          mkdir -p .cache/godot .cache/tools .cache/hf-assets artifacts
      - name: Install Godot if cache is empty
        run: |
          set -euo pipefail
          if [ ! -x "$GODOT_BIN" ]; then
            curl --fail --location --retry 4 --retry-all-errors "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o .cache/godot/godot.zip
            unzip -o .cache/godot/godot.zip -d .cache/godot
            chmod +x "$GODOT_BIN"
          fi
          "$GODOT_BIN" --version
      - name: Install gltfpack if cache is empty
        run: |
          set -euo pipefail
          if [ ! -x .cache/tools/bin/gltfpack ]; then npm install --global --prefix "$GITHUB_WORKSPACE/.cache/tools" gltfpack; fi
          export PATH="$GITHUB_WORKSPACE/.cache/tools/bin:$PATH"
          command -v gltfpack
          echo "$GITHUB_WORKSPACE/.cache/tools/bin" >> "$GITHUB_PATH"
      - name: Install Python fetch dependencies
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --cache-dir "$PIP_CACHE_DIR" "huggingface_hub>=0.26,<1.0" hf_transfer requests
      - name: Fetch approved assets only on cache miss
        if: steps.assets.outputs.cache-hit != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_ENABLE_HF_TRANSFER: "1"
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo "::error::HF_TOKEN secret is missing"; exit 1; }
          .venv/bin/python ci/fetch_assets.py 2>&1 | tee artifacts/asset_fetch.log
          test -s .cache/hf-assets/twin_city_runtime_assets.json
          test -s artifacts/landmark_sources.txt
          cp artifacts/landmark_sources.txt .cache/hf-assets/landmark_sources.txt
      - name: Prepare Checkpoint 2 terrain assets and upload CC0 textures
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          .venv/bin/python ci/prepare_wilderness.py 2>&1 | tee artifacts/wilderness_prepare.log
          test -s .cache/hf-assets/wilderness_checkpoint2_manifest.json
          test -s artifacts/wilderness_asset_report.json
      - name: Reuse cached asset source report
        if: steps.assets.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          test -s .cache/hf-assets/twin_city_runtime_assets.json
          test -s .cache/hf-assets/landmark_sources.txt
          cp .cache/hf-assets/landmark_sources.txt artifacts/landmark_sources.txt
          echo "HF_ASSET_CACHE_HIT: no asset re-download required"
      - name: Upload preparation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twin-city-asset-preparation-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            artifacts/asset_fetch.log
            artifacts/landmark_sources.txt

  render-checkpoint1:
    name: Import project and render six Twin City views
    needs: prepare-assets-and-tools
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install rendering runtime dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl unzip xvfb xauth libgl1 libglx-mesa0 libegl1 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2 libpulse0 libfontconfig1 libxkbcommon0
          sudo rm -rf /var/lib/apt/lists/*
          mkdir -p .cache/godot .cache/tools .cache/hf-assets artifacts
      - name: Restore Godot 4.3 cache
        uses: actions/cache@v4
        with:
          path: .cache/godot
          key: godot-4.3-linux-x64-v1
      - name: Restore gltfpack cache
        uses: actions/cache@v4
        with:
          path: .cache/tools
          key: twin-city-tools-linux-v1
      - name: Restore approved asset cache
        uses: actions/cache@v4
        with:
          path: .cache/hf-assets
          key: wilderness-hf-assets-v6-${{ hashFiles('ci/fetch_assets.py', 'ci/prepare_wilderness.py') }}
      - name: Restore Godot imported resources
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot43-imported-v2-${{ hashFiles('project.godot', 'scenes/**/*.tscn', 'scripts/**/*.gd') }}
          restore-keys: |
            godot43-imported-v2-
      - name: Verify prepared cache
        run: |
          set -euo pipefail
          test -x "$GODOT_BIN"
          "$GODOT_BIN" --version
          test -s .cache/hf-assets/twin_city_runtime_assets.json
          test -s .cache/hf-assets/landmark_sources.txt
          test -x .cache/tools/bin/gltfpack
          cp .cache/hf-assets/landmark_sources.txt artifacts/landmark_sources.txt
          echo PREPARED_ASSETS_AND_TOOLS_READY
      - name: Fetch approved Ranger hero and class weapons
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo "::error::HF_TOKEN secret is missing"; exit 1; }
          python3 -m pip install --disable-pip-version-check "huggingface_hub>=0.26,<1.0"
          python3 - <<'PY'
          import pathlib, shutil, os
          from huggingface_hub import hf_hub_download
          repo = "ZzwahwahzZ/clash-of-legends-terrain-assets"
          targets = {
              "phase3b/characters/archer_male.glb": "assets/phase3b/characters/Male_Ranger.glb",
              "phase3b/characters/archer_female.glb": "assets/phase3b/characters/Female_Ranger.glb",
              "phase3b/weapons/bow_beginner.glb": "assets/phase3b/weapons/bow_beginner.glb",
              "phase3b/weapons/dual_knives_beginner.glb": "assets/phase3b/weapons/dual_knives_beginner.glb",
              "phase3b/weapons/dual_blades_beginner.glb": "assets/phase3b/weapons/dual_blades_beginner.glb",
              "phase3b/weapons/shield_beginner.glb": "assets/phase3b/weapons/shield_beginner.glb",
              "phase3b/weapons/greatsword_beginner.glb": "assets/phase3b/weapons/greatsword_beginner.glb",
              "phase3b/weapons/magic_staff_beginner.glb": "assets/phase3b/weapons/magic_staff_beginner.glb",
          }
          for source, target in targets.items():
              downloaded = pathlib.Path(hf_hub_download(repo_id=repo, repo_type="dataset", filename=source, token=os.environ["HF_TOKEN"]))
              destination = pathlib.Path(target)
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(downloaded, destination)
              data = destination.read_bytes()
              if len(data) < 10000 or data[:4] != b"glTF":
                  raise SystemExit("Invalid approved hero/weapon GLB: " + target)
              print("TWIN_CITY_HERO_ASSET_OK:", target, "bytes=", len(data))
          PY
      - name: Cache Phase 5A mobile UI assets
        id: mobile_ui_assets
        uses: actions/cache@v4
        with:
          path: |
            assets/ui
            assets/icons
            assets/fonts
          key: phase5a-mobile-ui-assets-v8
      - name: Fetch real Kenney RPG icons, ornate fantasy frame and menu artwork
        run: |
          set -euo pipefail
          mkdir -p assets/ui/borders assets/ui/slots assets/ui/buttons assets/ui/skills assets/ui/menu assets/icons/rpg assets/fonts
          rm -rf /tmp/kenney
          trap 'rm -rf /tmp/kenney' EXIT
          git clone --depth 1 https://github.com/shorepine/kenney.git /tmp/kenney
          python3 - <<'PY'
          import pathlib, shutil, re, csv
          
          root = pathlib.Path("/tmp/kenney").resolve()
          index_path = root / "index.tsv"
          if not index_path.is_file():
              raise SystemExit("Kenney index.tsv is missing")
          
          excluded = {"tank", "car", "vehicle", "steering", "space", "alien", "ship", "ufo", "plane"}
          split_words = re.compile(r"[_\\-\\s/\\.]+")
          
          def png_ok(path):
              try:
                  data = path.read_bytes()
                  return len(data) > 100 and data[:8] == bytes.fromhex("89504e470d0a1a0a")
              except OSError:
                  return False
          
          # index.tsv columns: path, description, WxH, bytes
          indexed = []
          with index_path.open("r", encoding="utf-8", newline="") as stream:
              for line in stream:
                  parts = line.rstrip("\r\n").split(chr(9))
                  if len(parts) < 2:
                      continue
                  rel, description = parts[0].strip(), parts[1].strip()
                  if not rel or rel.lower() == "path":
                      continue
                  tokens = set(split_words.split((rel + " " + description).lower()))
                  if tokens & excluded:
                      continue
                  if pathlib.PurePosixPath(rel).suffix.lower() != ".png":
                      continue
                  source = (root / rel).resolve()
                  if root not in source.parents or not source.is_file() or not png_ok(source):
                      continue
                  indexed.append((source, tokens, rel.lower(), description.lower()))
          
          if not indexed:
              raise SystemExit("Kenney index.tsv yielded no valid non-vehicle PNG artwork")
          
          def copy_png(source, destination):
              target = pathlib.Path(destination)
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              print(f"PHASE5A_REAL_ART_OK: {target} bytes={target.stat().st_size} source={source}")
          
          # One authoritative ornate frame, copied to both consumers.
          border_candidates = [
              root / "ui" / "Fantasy UI Borders" / "Border" / "panel-border-018.png",
              root / "ui" / "Fantasy UI Borders" / "Border" / "panel-border-000.png",
          ]
          border = next((p for p in border_candidates if p.is_file() and png_ok(p)), None)
          if border is None:
              raise SystemExit("Required Fantasy UI Borders frame 018/000 is missing or invalid")
          copy_png(border, "assets/ui/borders/ornate_panel.png")
          copy_png(border, "assets/ui/slots/ornate_slot.png")
          
          legacy = {
              "panel_brown.png": "assets/ui/borders/panel_brown.png",
              "panel_beige.png": "assets/ui/borders/panel_beige.png",
              "panelinset_brown.png": "assets/ui/slots/slot_brown.png",
              "panelinset_beige.png": "assets/ui/slots/slot_beige.png",
              "buttonlong_brown.png": "assets/ui/buttons/btn_brown.png",
              "buttonlong_brown_pressed.png": "assets/ui/buttons/btn_brown_pressed.png",
              "buttonsquare_brown.png": "assets/ui/buttons/btn_sq_brown.png",
              "buttonsquare_brown_pressed.png": "assets/ui/buttons/btn_sq_brown_pressed.png"
          }
          for name, target in legacy.items():
              matches = [p for p, _, _, _ in indexed if p.name.lower() == name]
              if matches:
                  copy_png(sorted(matches, key=lambda p: str(p))[0], target)
          
          # Exact token categories; paths and descriptions are both indexed.
          categories = {
              "bow": {"bow"},
              "sword": {"sword"},
              "dagger": {"dagger"},
              "armor": {"armor", "shield", "chestplate", "tunic", "vest"},
              "helmet": {"helmet", "crown", "hood", "hat"},
              "boots": {"boot", "boots", "shoe"},
              "ring": {"ring", "band"},
              "necklace": {"amulet", "gem", "medal", "necklace", "pendant", "charm"},
              "potion": {"potion", "bottle", "flask", "vial"},
              "gem": {"gem", "crystal", "diamond", "ruby", "emerald"},
              "skill": {"fire", "lightning", "arrow", "star", "flame", "bolt", "wind", "heal", "speed"}
          }
          
          def ranked_candidates(terms):
              matches = [(p, tokens, rel, desc) for p, tokens, rel, desc in indexed if tokens & terms]
              matches.sort(key=lambda item: (
                  not any(part in item[2] for part in ("/icons/", "/icon/", "/ui/")),
                  len(item[2]), item[2]
              ))
              return matches
          
          # Fallback pool is deliberately limited to icon artwork and weapon/gem-like assets.
          fallback_pool = [
              item for item in indexed
              if ("icon" in item[1] or "/icons/" in item[2] or "/icon/" in item[2])
              and item[1] & {"weapon", "sword", "bow", "dagger", "gem", "crystal", "diamond", "ruby", "emerald"}
          ]
          if not fallback_pool:
              fallback_pool = [item for item in indexed if item[1] & {"weapon", "sword", "bow", "dagger", "gem", "crystal"}]
          if not fallback_pool:
              raise SystemExit("No safe weapon/gem icon fallback exists in Kenney index.tsv")
          
          copied = 0
          for category, terms in categories.items():
              matches = ranked_candidates(terms)
              if not matches:
                  print(f"::warning::No direct indexed match for {category}; using weapon/gem icon fallback")
                  matches = fallback_pool
              source = matches[0][0]
              copy_png(source, f"assets/icons/rpg/{category}__1__{source.name}")
              copied += 1
          
          # Keep the existing HUD skill texture contract populated from indexed art.
          skill_targets = {
              "bow": {"bow", "arrow"},
              "arrow": {"arrow", "bow"},
              "fire": {"fire", "flame"},
              "lightning": {"lightning", "bolt"},
              "speed": {"speed", "wind"},
              "shield": {"shield", "armor"}
          }
          for label, terms in skill_targets.items():
              matches = ranked_candidates(terms)
              source = matches[0][0] if matches else fallback_pool[0][0]
              copy_png(source, f"assets/ui/skills/{label}.png")
          
          print(f"PHASE5A_KENNEY_RPG_ICONS_READY: categories_copied={copied}/11 index_rows={len(indexed)}")
          PY
          rm -rf /tmp/kenney
          trap - EXIT
          test ! -e /tmp/kenney
          for file in settings bag quest character; do
            if [ -s "assets/ui/menu/$file.png" ]; then echo "PHASE5A_MENU_ICON_OK: $file"; else echo "::warning::Optional menu icon missing: $file"; fi
          done
          for file in bow sword dagger armor helmet boots ring necklace potion gem skill; do
            if find assets/icons/rpg -maxdepth 1 -type f -iname "${file}__*.png" -print -quit | grep -q .; then
              echo "PHASE5A_RPG_CATEGORY_OK: $file"
            else
              echo "::warning::Optional RPG category icon missing: $file"
            fi
          done
          test -d assets/icons/rpg
      - name: Verify Phase 5A ornate UI, skill icons and cache inputs
        run: |
          set -euo pipefail
          for file in assets/ui/borders/panel_brown.png assets/ui/borders/panel_beige.png assets/ui/slots/slot_brown.png assets/ui/slots/slot_beige.png assets/ui/slots/ornate_slot.png assets/ui/borders/ornate_panel.png assets/ui/buttons/btn_brown.png assets/ui/buttons/btn_brown_pressed.png assets/ui/buttons/btn_sq_brown.png assets/ui/buttons/btn_sq_brown_pressed.png assets/ui/skills/bow.png assets/ui/skills/arrow.png assets/ui/skills/fire.png assets/ui/skills/lightning.png assets/ui/skills/speed.png assets/ui/skills/shield.png; do
            test -s "$file" || { echo "::error::Missing or empty asset: $file"; exit 1; }
            bytes=$(stat -c%s "$file")
            [ "$bytes" -gt 100 ] || { echo "::error::Asset is too small: $file ($bytes bytes)"; exit 1; }
            if [[ "$file" == *.png ]]; then
              signature=$(od -An -tx1 -N8 "$file" | tr -d ' \n')
              [ "$signature" = "89504e470d0a1a0a" ] || { echo "::error::Invalid PNG signature: $file"; exit 1; }
            fi
            echo "PHASE5A_ASSET_OK: $file bytes=$bytes"
          done
          icon_pngs=$(find assets/icons/rpg -type f -iname '*.png' | wc -l)
          [ "$icon_pngs" -ge 8 ] && [ "$icon_pngs" -le 30 ] || { echo "::error::RPG icon count outside 8..30: $icon_pngs"; exit 1; }
          echo "PHASE5A_RPG_ICON_PNG_COUNT: $icon_pngs"

      - name: Install verified Noto Sans Arabic font
        run: |
          set -euo pipefail
          mkdir -p assets/fonts
          curl --fail --location --retry 4 --retry-all-errors "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansarabic/NotoSansArabic%5Bwdth%2Cwght%5D.ttf" -o assets/fonts/NotoSansArabic-Bold.ttf
          font_bytes=$(stat -c%s assets/fonts/NotoSansArabic-Bold.ttf)
          [ "$font_bytes" -gt 50000 ] || { echo "::error::Noto Sans Arabic font is too small: $font_bytes bytes"; exit 1; }
          echo "PHASE5A_ARABIC_FONT_READY: bytes=$font_bytes"

      - name: Verify Phase 5A mobile UI assets and cache inputs
        run: |
          set -euo pipefail
          for file in \
            assets/ui/borders/panel_brown.png \
            assets/ui/borders/panel_beige.png \
            assets/ui/slots/slot_brown.png \
            assets/ui/slots/slot_beige.png \
            assets/ui/buttons/btn_brown.png \
            assets/ui/buttons/btn_brown_pressed.png \
            assets/ui/buttons/btn_sq_brown.png \
            assets/ui/buttons/btn_sq_brown_pressed.png \
            assets/fonts/NotoSansArabic-Bold.ttf; do
            test -s "$file" || { echo "::error::Missing or empty asset: $file"; exit 1; }
            bytes=$(stat -c%s "$file")
            [ "$bytes" -gt 100 ] || { echo "::error::Asset is too small: $file ($bytes bytes)"; exit 1; }
            if [[ "$file" == *.png ]]; then
              signature=$(od -An -tx1 -N8 "$file" | tr -d ' \n')
              [ "$signature" = "89504e470d0a1a0a" ] || { echo "::error::Invalid PNG signature: $file"; exit 1; }
            fi
            echo "PHASE5A_ASSET_OK: $file bytes=$bytes"
          done
          test -d assets/icons/rpg
          icon_pngs=$(find assets/icons/rpg -type f -iname '*.png' | wc -l)
          [ "$icon_pngs" -ge 8 ] && [ "$icon_pngs" -le 30 ] || { echo "::error::RPG icon count outside 8..30: $icon_pngs"; exit 1; }
          while IFS= read -r file; do
            bytes=$(stat -c%s "$file")
            [ "$bytes" -gt 100 ] || { echo "::error::RPG icon PNG is too small: $file ($bytes bytes)"; exit 1; }
            signature=$(od -An -tx1 -N8 "$file" | tr -d ' \n')
            [ "$signature" = "89504e470d0a1a0a" ] || { echo "::error::Invalid RPG icon PNG signature: $file"; exit 1; }
          done < <(find assets/icons/rpg -type f -iname '*.png' | sort)
          echo "PHASE5A_RPG_ICON_PNG_COUNT: $icon_pngs"

      - name: Fetch and cache verified CC0 mount models
        id: mounts
        uses: actions/cache@v4
        with:
          path: assets/mounts
          key: phase5a-cc0-mounts-v1-${{ hashFiles('.github/workflows/checkpoint1-preview.yml') }}
      - name: Download Quaternius horse, deer and wolf plus Gobkit tiger
        if: steps.mounts.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p assets/mounts
          rm -rf /tmp/quaternius-showcase
          git clone --depth 1 https://github.com/trebeljahr/quaternius-showcase.git /tmp/quaternius-showcase
          grep -q 'animals_pack.*Ultimate Animated Animal Pack.*CC0-1.0' /tmp/quaternius-showcase/LICENSES.md
          python3 - <<'PY'
          import pathlib, shutil, subprocess, struct, json, urllib.request
          root = pathlib.Path("/tmp/quaternius-showcase")
          output = pathlib.Path("assets/mounts")
          mapping = {"Horse":"steed_horse.glb", "Deer":"mount_deer.glb", "Wolf":"mount_wolf.glb"}
          for identity, filename in mapping.items():
              candidates = [p for p in (root / "public/glb").rglob("*.glb") if identity.lower() in p.stem.lower()]
              if not candidates:
                  raise SystemExit("Quaternius model missing from verified CC0 pack mirror: " + identity)
              exact = [p for p in candidates if p.stem.lower() == identity.lower()]
              source = sorted(exact or candidates)[0]
              destination = output / filename
              subprocess.run(["gltfpack", "-i", str(source), "-o", str(destination)], check=True)
              print("QUATERNIUS_SOURCE:", identity, source.relative_to(root))
          tiger_url = "https://gobkit.com/freebies/animal012/SumatranTiger.glb"
          tiger_path = output / "mount_tiger.glb"
          urllib.request.urlretrieve(tiger_url, tiger_path)
          print("GOBKIT_SOURCE: SumatranTiger.glb", tiger_url)
          def verify(path):
              data = path.read_bytes()
              if len(data) <= 5000 or data[:4] != b"glTF":
                  raise SystemExit("Invalid or undersized GLB: " + str(path))
              magic, version, total = struct.unpack_from("<4sII", data, 0)
              if version != 2 or total != len(data):
                  raise SystemExit("Invalid GLB header/length: " + str(path))
              chunk_len, chunk_type = struct.unpack_from("<II", data, 12)
              if chunk_type != 0x4E4F534A:
                  raise SystemExit("Missing GLB JSON chunk: " + str(path))
              doc = json.loads(data[20:20+chunk_len].decode("utf-8").rstrip(" \\0"))
              if doc.get("asset", {}).get("version") != "2.0" or not doc.get("meshes"):
                  raise SystemExit("GLB has no valid glTF 2.0 mesh payload: " + str(path))
              print("PHASE5A_MOUNT_GLB_VERIFIED:", path, "bytes=", len(data), "meshes=", len(doc["meshes"]))
          for path in sorted(output.glob("*.glb")):
              verify(path)
          expected = {"steed_horse.glb", "mount_deer.glb", "mount_wolf.glb", "mount_tiger.glb"}
          actual = {p.name for p in output.glob("*.glb")}
          if actual != expected:
              raise SystemExit("Mount set mismatch: " + repr(actual))
          PY
          rm -rf /tmp/quaternius-showcase
      - name: Verify all cached mount GLB files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, struct, json
          root=pathlib.Path("assets/mounts")
          expected={"steed_horse.glb","mount_deer.glb","mount_wolf.glb","mount_tiger.glb"}
          actual={p.name for p in root.glob("*.glb")}
          if actual != expected: raise SystemExit("Mount cache incomplete: "+repr(actual))
          for path in sorted(root.glob("*.glb")):
              data=path.read_bytes()
              if len(data)<=5000 or data[:4]!=b"glTF": raise SystemExit("Bad GLB: "+str(path))
              _,version,total=struct.unpack_from("<4sII",data,0)
              length,kind=struct.unpack_from("<II",data,12)
              doc=json.loads(data[20:20+length].decode("utf-8").rstrip(" \\0"))
              if version!=2 or total!=len(data) or kind!=0x4E4F534A or not doc.get("meshes"): raise SystemExit("Invalid GLB payload: "+str(path))
              print("PHASE5A_MOUNT_CACHE_OK:",path,"bytes=",len(data),"meshes=",len(doc["meshes"]))
          PY
      - name: Functional GameSettings integration test in Twin City scene
        env:
          SETTINGS_FUNCTIONAL_TEST: "1"
        run: |
          set -euo pipefail
          timeout 180s "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --script res://scripts/validate_mobile_hud.gd 2>&1 | tee artifacts/settings_functional_test.log
          grep -q "PHASE5A_MOBILE_HUD_PARSE_OK" artifacts/settings_functional_test.log
          grep -q "SETTINGS_FUNCTIONAL_TEST_PASS=true" artifacts/settings_functional_test.log
          ! grep -E "SCRIPT ERROR|Parse Error|SETTINGS_TEST_FAILED|Failed to load script|Failed loading resource" artifacts/settings_functional_test.log
      - name: Import Godot project
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --import --quit 2>&1 | tee artifacts/import.log
      - name: Build locked shared animation resource
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --script res://scripts/animation/ConquerHeroAnimationBuilder.gd 2>&1 | tee artifacts/hero_animation_build.log
          test -s assets/phase4/animations/conquer_hero_anims.res
          grep -q "PHASE4A_ANIMATION_LIBRARY_OK" artifacts/hero_animation_build.log
      - name: Render Twin City and capture six views
        run: |
          set -euo pipefail
          export LIBGL_ALWAYS_SOFTWARE=1
          CI_CAPTURE=1 xvfb-run -a -s "-screen 0 960x540x24" timeout 1500s "$GODOT_BIN" --path "$GITHUB_WORKSPACE" --rendering-driver opengl3 --audio-driver Dummy --resolution 960x540 res://scenes/TwinCity.tscn 2>&1 | tee artifacts/godot.log
      - name: Render Phase 3A-3 four cities and six preview views
        run: |
          set -euo pipefail
          export LIBGL_ALWAYS_SOFTWARE=1
          CI_CAPTURE=1 xvfb-run -a -s "-screen 0 960x540x24" timeout 1500s "$GODOT_BIN" --path "$GITHUB_WORKSPACE" --rendering-driver opengl3 --audio-driver Dummy --resolution 960x540 res://scenes/Phase3A3Preview.tscn 2>&1 | tee artifacts/phase3a3.log
          for image in city_phoenix_castle.png city_ape_mountain.png city_desert_city.png city_bird_island.png city_desert_oasis_closeup.png city_bird_island_bridges_closeup.png; do
            test -s "artifacts/$image"
            size=$(stat -c%s "artifacts/$image")
            [ "$size" -gt 15000 ] || { echo "::error::Preview image $image is too small: $size bytes (expected > 15000)"; exit 1; }
          done
          grep -q "PHASE3A3_ALL_SIX_CAPTURES_COMPLETE" artifacts/phase3a3.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script|PHASE3A3_CAPTURE_FAILED|PHASE3A3_REQUIRED_ASSET_MISSING" artifacts/phase3a3.log

      - name: Render MobileHUD inventory and character preview
        run: |
          set -euo pipefail
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s "-screen 0 1600x900x24" timeout 1500s "$GODOT_BIN" --path "$GITHUB_WORKSPACE" --rendering-driver opengl3 --audio-driver Dummy --resolution 1600x900 -- --preview-mobile-hud 2>&1 | tee artifacts/mobile_hud_preview.log
          test -s artifacts/mobile_hud_inventory_preview.png
          test -s artifacts/mobile_hud_character_preview.png
          for image in mobile_hud_inventory_preview.png mobile_hud_character_preview.png; do
            size=$(stat -c%s "artifacts/$image")
            [ "$size" -gt 1024 ] || { echo "::error::Mobile HUD preview $image is too small: $size bytes"; exit 1; }
          done
          grep -q "PHASE5A_MOBILE_HUD_PREVIEW_CAPTURE_OK: inventory=true character=true icons=true" artifacts/mobile_hud_preview.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script|PHASE5A_MOBILE_HUD_PREVIEW_FAILED" artifacts/mobile_hud_preview.log

      - name: Upload six captures and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twin-city-checkpoint1-preview-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
