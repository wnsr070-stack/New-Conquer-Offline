name: Twin City Checkpoint 1 Preview
on:
  push:
    branches: ['test/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checkpoint1-preview-${{ github.ref }}
  cancel-in-progress: true
env:
  GODOT_VERSION: "4.3"
  GODOT_BIN: ".cache/godot/Godot_v4.3-stable_linux.x86_64"
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  HF_ASSET_CACHE_DIR: ${{ github.workspace }}/.cache/hf-assets
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
  LIBGL_ALWAYS_SOFTWARE: "1"
  CI_CAPTURE: "1"
jobs:
  prepare-assets-and-tools:
    name: Prepare cached Godot, gltfpack and verified assets
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Cache Godot 4.3
        uses: actions/cache@v4
        with:
          path: .cache/godot
          key: godot-4.3-linux-x64-v1
      - name: Cache gltfpack
        uses: actions/cache@v4
        with:
          path: .cache/tools
          key: twin-city-tools-linux-v1
      - name: Cache Hugging Face and external assets
        id: assets
        uses: actions/cache@v4
        with:
          path: .cache/hf-assets
          key: twin-city-hf-assets-v4-${{ hashFiles('ci/fetch_assets.py') }}
      - name: Install preparation dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl unzip python3-pip python3-venv
          sudo rm -rf /var/lib/apt/lists/*
          mkdir -p .cache/godot .cache/tools .cache/hf-assets artifacts
      - name: Install Godot if cache is empty
        run: |
          set -euo pipefail
          if [ ! -x "$GODOT_BIN" ]; then
            curl --fail --location --retry 4 --retry-all-errors "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o .cache/godot/godot.zip
            unzip -o .cache/godot/godot.zip -d .cache/godot
            chmod +x "$GODOT_BIN"
          fi
          "$GODOT_BIN" --version
      - name: Install gltfpack if cache is empty
        run: |
          set -euo pipefail
          if [ ! -x .cache/tools/bin/gltfpack ]; then npm install --global --prefix "$GITHUB_WORKSPACE/.cache/tools" gltfpack; fi
          export PATH="$GITHUB_WORKSPACE/.cache/tools/bin:$PATH"
          command -v gltfpack
          echo "$GITHUB_WORKSPACE/.cache/tools/bin" >> "$GITHUB_PATH"
      - name: Install Python fetch dependencies
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --cache-dir "$PIP_CACHE_DIR" "huggingface_hub>=0.26,<1.0" hf_transfer requests
      - name: Fetch approved assets only on cache miss
        if: steps.assets.outputs.cache-hit != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_ENABLE_HF_TRANSFER: "1"
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo "::error::HF_TOKEN secret is missing"; exit 1; }
          .venv/bin/python ci/fetch_assets.py 2>&1 | tee artifacts/asset_fetch.log
          test -s .cache/hf-assets/twin_city_runtime_assets.json
          test -s artifacts/landmark_sources.txt
          cp artifacts/landmark_sources.txt .cache/hf-assets/landmark_sources.txt
      - name: Reuse cached asset source report
        if: steps.assets.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          test -s .cache/hf-assets/twin_city_runtime_assets.json
          test -s .cache/hf-assets/landmark_sources.txt
          cp .cache/hf-assets/landmark_sources.txt artifacts/landmark_sources.txt
          echo "HF_ASSET_CACHE_HIT: no asset re-download required"
      - name: Upload preparation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twin-city-asset-preparation-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            artifacts/asset_fetch.log
            artifacts/landmark_sources.txt

  render-checkpoint1:
    name: Import project and render six Twin City views
    needs: prepare-assets-and-tools
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install rendering runtime dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl unzip xvfb xauth libgl1 libglx-mesa0 libegl1 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2 libpulse0 libfontconfig1 libxkbcommon0
          sudo rm -rf /var/lib/apt/lists/*
          mkdir -p .cache/godot .cache/tools .cache/hf-assets artifacts
      - name: Restore Godot 4.3 cache
        uses: actions/cache@v4
        with:
          path: .cache/godot
          key: godot-4.3-linux-x64-v1
      - name: Restore gltfpack cache
        uses: actions/cache@v4
        with:
          path: .cache/tools
          key: twin-city-tools-linux-v1
      - name: Restore approved asset cache
        uses: actions/cache@v4
        with:
          path: .cache/hf-assets
          key: twin-city-hf-assets-v4-${{ hashFiles('ci/fetch_assets.py') }}
      - name: Restore Godot imported resources
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot43-imported-v2-${{ hashFiles('project.godot', 'scenes/**/*.tscn', 'scripts/**/*.gd') }}
          restore-keys: |
            godot43-imported-v2-
      - name: Verify prepared cache
        run: |
          set -euo pipefail
          test -x "$GODOT_BIN"
          "$GODOT_BIN" --version
          test -s .cache/hf-assets/twin_city_runtime_assets.json
          test -s .cache/hf-assets/landmark_sources.txt
          test -x .cache/tools/bin/gltfpack
          cp .cache/hf-assets/landmark_sources.txt artifacts/landmark_sources.txt
          echo PREPARED_ASSETS_AND_TOOLS_READY
      - name: Import Godot project
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --import --quit 2>&1 | tee artifacts/import.log
      - name: Render Twin City and capture six views
        run: |
          set -euo pipefail
          export LIBGL_ALWAYS_SOFTWARE=1
          CI_CAPTURE=1 xvfb-run -a -s "-screen 0 1280x720x24" timeout 300s "$GODOT_BIN" --path "$GITHUB_WORKSPACE" --rendering-driver opengl3 --audio-driver Dummy --resolution 1280x720 res://scenes/TwinCity.tscn 2>&1 | tee artifacts/godot.log
      - name: Upload six captures and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twin-city-checkpoint1-preview-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/twin_city_overview.png
            artifacts/twin_city_palace.png
            artifacts/twin_city_ne_pagoda.png
            artifacts/twin_city_nw_quest_hall.png
            artifacts/twin_city_se_tea_house.png
            artifacts/twin_city_sw_blacksmith.png
            artifacts/landmarks_preview.png
            artifacts/landmark_sources.txt
            artifacts/import.log
            artifacts/godot.log
      - name: Verify all six captures and checkpoint markers
        if: always()
        run: |
          set -euo pipefail
          for image in twin_city_overview.png twin_city_palace.png twin_city_ne_pagoda.png twin_city_nw_quest_hall.png twin_city_se_tea_house.png twin_city_sw_blacksmith.png; do test -s "artifacts/$image"; done
          test -s artifacts/landmark_sources.txt
          grep -q "CHECKPOINT1_UNIFIED_DIRT_GROUND_OK:" artifacts/godot.log
          grep -q "CHECKPOINT1_COBBLESTONE_PLAZA_OK:" artifacts/godot.log
          grep -q "CHECKPOINT1_COBBLE_RUNTIME_IMAGE_TEXTURES_OK:" artifacts/godot.log
          grep -q "CHECKPOINT1_CITY_WALL_PIECES_OK: 108 pieces" artifacts/godot.log
          grep -q "CHECKPOINT1_MOAT_WIDTH_OK: 18m continuous ring" artifacts/godot.log
          grep -q "CHECKPOINT1_FOUR_BRIDGES_OK: north south east west" artifacts/godot.log
          grep -q "CHECKPOINT1_FULL_GROUND_NO_GREEN_GAPS_OK: 320x320m" artifacts/godot.log
          grep -q "CHECKPOINT1_IMPERIAL_PALACE_SOURCE_OK: valid GLB bytes=" artifacts/godot.log
          grep -q "CHECKPOINT1_GROUND_GREEN_MATERIAL_OVERRIDE_OK:" artifacts/godot.log
          grep -q "CHECKPOINT1_TEA_HOUSE_DECOR_OK:" artifacts/godot.log
          grep -q "CHECKPOINT1_EASTERN_GATE_GLTF_APPEND_OK:" artifacts/godot.log
          grep -q "CHECKPOINT1_BLACKSMITH_SOURCE_OK: valid local GLB bytes=" artifacts/godot.log
          grep -q "CHECKPOINT1_BLACKSMITH_GODOT_IMPORT_OK:" artifacts/godot.log
          grep -q "CHECKPOINT1_BLACKSMITH_GLTF_APPEND_OK: open-front forge width=14m rotation=0deg" artifacts/godot.log
          grep -q "pink-roof candidate excluded" artifacts/godot.log
          grep -q "CHECKPOINT1_ALL_SIX_CAPTURES_COMPLETE" artifacts/godot.log
          grep -q "CHECKPOINT1_PALACE_PLATFORM_OK:" artifacts/godot.log
          grep -q "CHECKPOINT1_ROTATED_AABB_REJECTION_OK:" artifacts/godot.log
          grep -q "CHECKPOINT1_ROTATED_AABB_AUTO_OFFSET_OK:" artifacts/godot.log
          grep -q "CHECKPOINT1_LANDMARK_OK: NE_PAGODA" artifacts/godot.log
          grep -q "CHECKPOINT1_LANDMARK_OK: NW_QUEST_HALL" artifacts/godot.log
          grep -q "CHECKPOINT1_LANDMARK_OK: SE_TEA_HOUSE" artifacts/godot.log
          grep -q "CHECKPOINT1_LANDMARK_OK: SW_BLACKSMITH" artifacts/godot.log
          for image in twin_city_overview.png twin_city_palace.png twin_city_ne_pagoda.png twin_city_nw_quest_hall.png twin_city_se_tea_house.png twin_city_sw_blacksmith.png; do grep -Fq "TWIN_CITY_CAPTURE_DONE: $image" artifacts/godot.log; done
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|TWIN_CITY_CAPTURE_FAILED|LANDMARKS_PREVIEW_FAILED|GLB import failed|ARCHITECTURE_WHITELIST_VIOLATION" artifacts/godot.log
