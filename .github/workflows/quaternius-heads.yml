name: Quaternius Standalone Head Extraction
on:
  push:
    branches: ['test/phase3b-characters-weapons']
    paths: ['ci/extract_quaternius_heads.py', '.github/workflows/quaternius-heads.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quaternius-heads-${{ github.ref }}
  cancel-in-progress: true
jobs:
  extract-heads:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/phase3b-characters-weapons
      - name: Install Blender
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender python3-numpy xvfb xauth libgl1-mesa-dri
          mkdir -p .cache/quaternius_heads artifacts/heads
          blender --background --factory-startup --python-expr "import numpy; print('BLENDER_NUMPY_OK',numpy.__version__)"
      - name: Restore source cache
        uses: actions/cache@v4
        with:
          path: .cache/quaternius_heads
          key: quaternius-ultimate-modular-head-sources-v1
      - name: Extract only two heads and render one QA image
        run: |
          set -euo pipefail
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 GITHUB_WORKSPACE="$GITHUB_WORKSPACE" blender --background --factory-startup --python-exit-code 1 --python ci/extract_quaternius_heads.py 2>&1 | tee artifacts/heads/extraction.log
          test -s artifacts/heads/male_head.glb
          test -s artifacts/heads/female_head.glb
          test -s artifacts/heads/heads_pair_preview.png
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path("artifacts/heads"); m=json.loads((root/"heads_manifest.json").read_text())
          assert {x["name"] for x in m["files"]}=={"male_head.glb","female_head.glb"}
          for x in m["files"]:
              b=(root/x["name"]).read_bytes()
              assert b[:4]==b"glTF" and int.from_bytes(b[8:12],"little")==len(b)
          print("QUATERNIUS_STANDALONE_HEADS_VALIDATED")
          PY
      - name: Upload heads and persistent cache to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check "huggingface_hub>=0.26,<1.0"
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi
          api=HfApi(token=os.environ["HF_TOKEN"])
          out=api.upload_folder(repo_id="ZzwahwahzZ/clash-of-legends-terrain-assets",repo_type="dataset",folder_path="artifacts/heads",path_in_repo="heads",ignore_patterns=["extraction.log"])
          if not getattr(out,"oid",None): raise RuntimeError("HF heads upload returned no commit")
          print("QUATERNIUS_HEADS_HF_UPLOAD_OK:",out.oid)
          cache=api.upload_folder(repo_id="ZzwahwahzZ/clash-of-legends-terrain-assets",repo_type="dataset",folder_path=".cache/quaternius_heads",path_in_repo="heads/cache/source")
          if not getattr(cache,"oid",None): raise RuntimeError("HF permanent source cache upload returned no commit")
          print("QUATERNIUS_HEADS_PERMANENT_CACHE_OK:",cache.oid)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quaternius-standalone-heads-${{ github.run_number }}
          path: artifacts/heads/**
          retention-days: 30
