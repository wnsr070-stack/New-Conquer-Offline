stages:
  - verify
variables:
  GODOT_VERSION: "4.3"
  HF_HOME: "$CI_PROJECT_DIR/.cache/huggingface"
  HF_ASSET_CACHE_DIR: "$CI_PROJECT_DIR/.cache/hf-assets"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  LIBGL_ALWAYS_SOFTWARE: "1"
  CI_CAPTURE: "1"
  GIT_DEPTH: "1"
cache:
  key: "godot43-hf-assets-$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/godot/
    - .cache/huggingface/
    - .cache/hf-assets/
    - .cache/pip/
boot-readiness:
  stage: verify
  image: python:3.11-slim-bookworm
  rules:
    - if: '$CI_COMMIT_BRANCH == "twin-city/imperial-visual-prototype"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl unzip xvfb xauth libgl1 libglx-mesa0 libegl1 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2 libpulse0
    - rm -rf /var/lib/apt/lists/*
    - mkdir -p .cache/godot artifacts
    - python -m pip install --disable-pip-version-check --cache-dir "$PIP_CACHE_DIR" "huggingface_hub>=0.26,<1.0"
  script:
    - |
      set -euo pipefail
      python ci/fetch_assets.py 2>&1 | tee artifacts/asset_fetch.log
      if [ ! -x ".cache/godot/Godot_v$GODOT_VERSION-stable_linux.x86_64" ]; then
        curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip" -o .cache/godot/godot.zip
        unzip -o .cache/godot/godot.zip -d .cache/godot
        chmod +x ".cache/godot/Godot_v$GODOT_VERSION-stable_linux.x86_64"
      fi
      GODOT_BIN=".cache/godot/Godot_v$GODOT_VERSION-stable_linux.x86_64"
      "$GODOT_BIN" --version
      xvfb-run -a -s "-screen 0 1280x720x24" "$GODOT_BIN" --path "$CI_PROJECT_DIR" --rendering-driver opengl3 --quit-after 180 2>&1 | tee artifacts/godot.log
      test -s artifacts/boot_check.png
      grep -q "BOOT_CAPTURE_OK:" artifacts/godot.log
      grep -q "BOOT_ASSET_OK: boulder_01" artifacts/godot.log
      grep -q "BOOT_ASSET_OK: mountainside" artifacts/godot.log
      grep -q "BOOT_ASSET_OK: dead_tree_trunk" artifacts/godot.log
      ! grep -E "SCRIPT ERROR|Parse Error|BOOT_CAPTURE_FAILED" artifacts/godot.log
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - artifacts/boot_check.png
      - artifacts/godot.log
      - artifacts/asset_fetch.log
