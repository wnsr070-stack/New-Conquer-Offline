stages:
  - preview

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "preview/objaverse-candidates"'
    - when: never

objaverse-visual-shortlist:
  stage: preview
  image: python:3.11-slim-bookworm
  timeout: 3h
  rules:
    - if: '$CI_COMMIT_BRANCH == "preview/objaverse-candidates"'
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends xvfb libgl1 libgl1-mesa-dri libglx-mesa0 libegl1 libosmesa6 libx11-6 libxext6 libxrender1
    - rm -rf /var/lib/apt/lists/*
    - python -m pip install --no-cache-dir "trimesh>=4.0,<5" "pyglet<2" pillow numpy
  script:
    - mkdir -p artifacts
    - xvfb-run -a -s "-screen 0 1280x1024x24" python ci/objaverse_preview.py 2>&1 | tee artifacts/preview.log
    - test -s artifacts/objaverse_preview/manifest.json
    - test "$(find artifacts/objaverse_preview -maxdepth 1 -name '*.png' | wc -l)" -eq 15
    - grep -q "OBJAVERSE_PREVIEW_COMPLETE: 15 candidates rendered" artifacts/preview.log
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - artifacts/objaverse_preview/
      - artifacts/preview.log
